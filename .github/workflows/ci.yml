name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: make test
      - name: Build app
        run: make app
      - uses: actions/upload-artifact@v4
        with:
          name: CheckUsage.app
          path: dist/CheckUsage.app
