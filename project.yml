name: CheckUsage
options:
  bundleIdPrefix: app.checkusage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  CheckUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/CheckUsage
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Logos
        type: folder
        buildPhase: resources
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Logos
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: CheckUsage
        CFBundleName: CheckUsage
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: Resources/CheckUsage.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.checkusage.CheckUsage
        PRODUCT_NAME: CheckUsage
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CheckUsage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postCompileScripts:
      - name: Copy brand logos
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Logos"
          mkdir -p "$DEST" "$DEST/png"
          cp -f "${SRCROOT}/Resources/Logos/"*.svg "$DEST/"
          cp -f "${SRCROOT}/Resources/Logos/png/"*.png "$DEST/png/"
          if [ -f "${SRCROOT}/Resources/AppIcon.icns" ]; then
            cp -f "${SRCROOT}/Resources/AppIcon.icns" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
          fi
  CheckUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CheckUsageTests
    dependencies:
      - target: CheckUsage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.checkusage.CheckUsageTests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
